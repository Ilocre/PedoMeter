<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonic Pedometer</title>
    <style>
        body {
            margin: 0;
            background-color: #B0B8C1;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .bg-pattern {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 80vh;
            background-image:
                linear-gradient(45deg, #D1D5D9 25%, transparent 25%),
                linear-gradient(-45deg, #D1D5D9 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #D1D5D9 75%),
                linear-gradient(-45deg, transparent 75%, #D1D5D9 75%);
            background-size: 40px 40px;
            background-position: 0 0, 0 20px, 20px -20px, -20px 0px;
            z-index: -1;
        }

        .main-content {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #sonic-img {
            max-width: 85%;
            max-height: 70vh;
            object-fit: contain;
        }

        .ui-buttons {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 10;
        }

        .btn-circle {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: white;
            border: 3px solid #222;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .btn-icon {
            width: 24px;
            height: 24px;
            object-fit: contain;
        }

        #btn-reset { background-color: #FFFF99; }
        #btn-stop { background-color: #FF4D4D; }
        #btn-map { background-color: #FFD700; }

        .footer-bar {
            background-color: black;
            color: white;
            width: 100%;
            height: 20vh;
            display: flex;
            justify-content: center;
            align-items: center;
            border-top: 4px solid #333;
        }

        #count {
            font-size: 80px;
            font-weight: bold;
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="bg-pattern"></div>

    <div class="main-content">
        <!-- Uses your local file -->
        <img id="sonic-img" src="sonic.png" alt="Sonic">

        <div class="ui-buttons">
            <div id="btn-reset" class="btn-circle" onclick="resetCount()">
                <img src="https://img.icons8.com/fluency/48/restart--v1.png" alt="Reset" class="btn-icon">
            </div>
            <div id="btn-stop" class="btn-circle">
                <img src="https://img.icons8.com/fluency/48/stop.png" alt="Stop" class="btn-icon">
            </div>
            <div id="btn-map" class="btn-circle">
                <img src="https://img.icons8.com/fluency/48/map-marker.png" alt="Map" class="btn-icon">
            </div>
        </div>
    </div>

    <div class="footer-bar">
        <p id="count">0</p>
    </div>

    <script>
        let pedoCount = 0;
        let lastShakeTime = 0;
        const countDisplay = document.getElementById('count');

        function requestPermission() {
            if (typeof DeviceMotionEvent.requestPermission === 'function') {
                DeviceMotionEvent.requestPermission()
                    .then(response => {
                        if (response === 'granted') {
                            window.addEventListener('devicemotion', handleMotion);
                        }
                    })
                    .catch(console.error);
            } else {
                window.addEventListener('devicemotion', handleMotion);
            }
        }

        function handleMotion(event) {
            const acc = event.accelerationIncludingGravity;
            if (!acc) return;

            const magnitude = Math.sqrt(acc.x * acc.x + acc.y * acc.y + acc.z * acc.z);
            const currentTime = Date.now();
            
            if (magnitude > 35 && (currentTime - lastShakeTime) > 300) {
                pedoCount++;
                countDisplay.textContent = pedoCount;
                lastShakeTime = currentTime;
            }
        }

        function resetCount() {
            pedoCount = 0;
            countDisplay.textContent = pedoCount;
        }

        document.body.addEventListener('click', requestPermission, { once: true });
    </script>
</body>
</html>
